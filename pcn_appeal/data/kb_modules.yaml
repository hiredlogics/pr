  # ---- NOT IN SOURCE DOCUMENT - held at REVIEW (KB-GOV-03) ----
  - module_id: KB-REC-01
    # Must NOT sit on EVIDENCE: that route's customer-facing label is
    # "Independent evidence contradicting the allegation", which mislabels a
    # cautious records request when validation is unconfirmed.
    route: RECORDS
    topic: Proportionate records request
    use_when:
      any:
        - {contains: [alleged_breach, "validat"]}
        - {contains: [alleged_breach, "voucher"]}
        - {contains: [alleged_breach, "kiosk"]}
        - {contains: [alleged_breach, "ticket machine"]}
        - {contains: [alleged_breach, "pay and display"]}
        - {contains: [alleged_breach, "permit"]}
    do_not_use_when: {always: false}
    core_proposition: >
      Where the allegation turns on a site validation, voucher, kiosk or similar
      step and the keeper's materials do not prove that step either way, request
      the operator's relevant system records without asserting that compliance
      occurred or that a defect is already proven.
    required_facts: [alleged_breach]
    evidence_helpful: [RECEIPT, PHOTO, CORRESPONDENCE, APP_SCREENSHOT]
    legal_basis: [SCOP-evidence]
    legal_basis_origin: NOT_IN_SOURCE
    drafting_notes: >
      Evidence request only. Never claim validation occurred, never claim the
      charge is invalid solely because records were not produced in advance, and
      never treat a shopping receipt as parking validation.
    prohibited_claims:
      - validation occurred
      - validation failed
      - the charge is automatically invalid
      - shopping receipt proves parking validation
    building_blocks: [PP-REC-001]
    strength: 55
    # Activated so validation / kiosk / permit-shaped notices have a leading
    # ground and auto-release a letter instead of landing on landowner-only hold.
    status: ACTIVE
    version: "1.1"
    effective_from: null
    effective_to: null
    last_legal_review: null
    source_reference: null  # not in source document
    change_notes: Activated with PP-REC-001 for automatic records-request letters on validation-shaped allegations.

