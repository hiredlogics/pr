# Derivation rules: notice facts -> KB gate facts (P8 fact-to-ground matching).
#
# Extraction reads raw values off the notice (location, contravention wording,
# entry/exit times). KB gates are written in terms of judgement facts
# (customer_only_site, permitted_period_ended, ...). These rules bridge the two
# deterministically, so a gate the notice can already settle is settled without
# asking the customer and without a model's judgement.
#
# Admin-editable data, like code_versions.yaml. Every rule is conservative:
#   * it only ever writes a value when its pattern matches; no match -> the fact
#     stays unknown and the question bank can still ask for it;
#   * it never overwrites a fact the customer confirmed, corrected or answered;
#   * thresholds come from the resolved Code version, never from this file.
#
# LEGAL SIGN-OFF REQUIRED before production: the breach classes, the
# permitted_period_ended mapping and the byelaw site list are judgement calls
# made in code review, not approved legal positions.

version: 1

# alleged_breach text -> alleged_breach_type. First match wins (order matters).
breach_types:
  - type: DROPOFF_ZONE
    patterns: ['pick[\s-]*up\s*/?\s*drop[\s-]*off', 'drop[\s-]*off\s+zone', 'forecourt']
  - type: OVERSTAY
    patterns: ['overst', 'exceed\w*\s+(the\s+)?max', 'max(imum)?\s+(stay|time)', 'longer than']
  - type: NO_PAYMENT
    patterns: ['no\s+valid\s+(parking\s+)?(session|ticket|payment|pay)', 'without\s+(making\s+)?(a\s+)?valid\s+payment',
               'not\s+paid', 'failed\s+to\s+(make|purchase|pay)', 'no\s+payment', 'insufficient\s+(time|payment)']
  - type: PERMIT
    patterns: ['permit', 'not\s+authori[sz]ed', 'residents?\s+only', 'without\s+(a\s+)?valid\s+permit']
  - type: RESTRICTED_BAY
    patterns: ['disabled\s+bay', 'parent\s*(and|&)\s*child', 'ev\s+bay', 'loading\s+bay', 'marked\s+bay', 'outside\s+(of\s+)?(a\s+)?bay']

# alleged_breach_type -> permitted_period_ended.
#   OVERSTAY: a maximum or paid period existed and was exceeded -> True.
#   DROPOFF_ZONE: pay-to-use stop with no prior paid period -> False.
# Other types are left unknown (the question bank asks).
permitted_period_ended:
  OVERSTAY: true
  DROPOFF_ZONE: false

# Site type from parking_location (and operator text). Pattern match only.
site_types:
  customer_only_site:
    patterns: ['sainsbury', 'tesco', '\basda\b', 'morrisons', '\baldi\b', '\blidl\b', 'waitrose', '\bco-?op\b',
               '\bb\s*&\s*m\b', 'iceland', 'marks\s*(and|&)\s*spencer', '\bm&s\b', 'home\s*bargains',
               'retail\s+park', 'shopping\s+cent(re|er)', 'mcdonald', '\bkfc\b', 'burger\s+king', '\bcosta\b',
               'starbucks', '\bpub\b', 'restaurant', '\bgym\b']
  dropoff_site:
    patterns: ['pick[\s-]*up\s*/?\s*drop[\s-]*off', 'drop[\s-]*off\s+zone', 'forecourt']
  hospital_site:
    patterns: ['hospital', '\bnhs\b', 'infirmary', 'medical\s+cent']

# Appeal period (client instruction 2026-10-07). After it, the appeal is NOT
# stopped: the customer is told the normal period may have expired and the
# letter carries PP-LATE-001. Counted from the uploaded notice's issue date.
appeal_period:
  days: 28

# Document stage (client instruction 2026-10-07). The classifier labels each
# upload's stage (INITIAL_NOTICE / REMINDER / DRIVER_LETTER); these patterns are
# the deterministic backup over any text the documents carry. A later-stage
# letter is never timed as if it were the first Notice to Keeper.
notice_stages:
  DRIVER_LETTER:
    patterns: ['parking\s+charge\s+to\s+driver', 'advised\s+that\s+you\s+were\s+the\s+driver',
               'you\s+(have\s+been|were)\s+(named|identified|nominated)\s+as\s+the\s+driver']
  REMINDER:
    patterns: ['\breminder\b', '\bfinal\s+notice\b', 'previously\s+(been\s+)?(sent|issued|served)',
               'we\s+(wrote|have\s+written)\s+to\s+you', 'has\s+previously\s+been\s+served']
# The original notice's date, when a later letter prints it.
original_notice_date:
  patterns: ['(?:notice\s+to\s+keeper|parking\s+charge\s+(?:notice|to\s+keeper)|original\s+notice)[^.\n]{0,60}?(?:issued|sent|served|dated)\s+(?:on\s+)?(\d{1,2}/\d{1,2}/\d{2,4})']

# Land under statutory control (byelaws) is not "relevant land" for PoFA
# Schedule 4, para 3. Client instruction 2026-10-07: never assume a whole
# airport is covered because airport byelaws exist. A location is ACTIVE only
# once it is confirmed that the byelaws / statutory control cover parking or
# waiting AT THAT LOCATION. Each entry therefore names a location, not just an
# airport: every pattern group in `all_of` must match the notice's location
# and contravention text together.
#
#   status CONFIRMED -> sets relevant_land = False -> pofa.assess emits the
#                       POFA_NOT_RELEVANT_LAND finding -> KB-POFA-07 leads.
#   status PENDING   -> recorded in the case audit for review; changes nothing.
#
# Railway land is deliberately not here and must stay separate: the Protection
# of Freedoms Act 2012 (Definition of Relevant Land) (Amendment) Order 2025,
# in force 26 December 2025, brought land under Railway Byelaws back into
# "relevant land".
statutory_control_sites:
  - id: LTN-PUDO
    name: London Luton Airport - Pick Up / Drop Off Zone
    status: CONFIRMED
    jurisdiction: ENGLAND_WALES
    confirmation: "Client instruction 2026-10-07 for current tests. Record the byelaw reference and the plan showing the zone before production."
    all_of:
      - ['luton\s+airport']
      - ['pick[\s-]*up\s*/?\s*drop[\s-]*off', 'drop[\s-]*off\s+zone', 'drop[\s-]*off\s+area']
  - id: STN-PUDO
    name: London Stansted Airport - Pick Up / Drop Off Zone
    status: CONFIRMED
    jurisdiction: ENGLAND_WALES
    confirmation: "Client instruction 2026-10-07 for current tests. Record the byelaw reference and the plan showing the zone before production."
    all_of:
      - ['stansted\s+airport']
      - ['pick[\s-]*up\s*/?\s*drop[\s-]*off', 'drop[\s-]*off\s+zone', 'drop[\s-]*off\s+area']
  # Awaiting validation (client to confirm location by location).
  - {id: LHR, name: Heathrow Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['heathrow']]}
  - {id: LGW, name: Gatwick Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['gatwick']]}
  - {id: MAN, name: Manchester Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['manchester\s+airport']]}
  - {id: BHX, name: Birmingham Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['birmingham\s+airport']]}
  - {id: BRS, name: Bristol Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['bristol\s+airport']]}
  - {id: EMA, name: East Midlands Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['east\s+midlands\s+airport']]}
  - {id: LPL, name: Liverpool John Lennon Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['liverpool\s+john\s+lennon']]}
  - {id: LCY, name: London City Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['london\s+city\s+airport']]}
  - {id: LBA, name: Leeds Bradford Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['leeds\s+bradford\s+airport']]}
  - {id: NCL, name: Newcastle Airport, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['newcastle\s+airport']]}
  # Luton / Stansted locations other than the drop-off zone (car parks,
  # forecourts) are not confirmed; they fall here and change nothing.
  - {id: LTN-OTHER, name: London Luton Airport - other locations, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['luton\s+airport']]}
  - {id: STN-OTHER, name: London Stansted Airport - other locations, status: PENDING, jurisdiction: ENGLAND_WALES, all_of: [['stansted\s+airport']]}
