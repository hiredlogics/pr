<!DOCTYPE html>
<!-- Customer journey: upload -> answer only what is missing -> letter.
     Nothing internal is shown here on purpose: no fact table, no confidence
     scores, no module or rule IDs, no decision trace. The reviewer view with
     all of that lives at /console. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appeal your parking charge</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --line:#e3e7ec; --ink:#16202c; --dim:#5d6b7a;
    --brand:#1f5fd0; --ok:#12794f; --warn:#8a5a00; --warnbg:#fff8e6;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:28px 20px 72px; }
  header { text-align:center; margin-bottom:26px; }
  header h1 { font-size:27px; margin:0 0 6px; letter-spacing:-.01em; }
  header p { margin:0; color:var(--dim); font-size:15px; }
  .steps { display:flex; justify-content:center; gap:10px; margin:22px 0 24px; }
  .dot { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); }
  .dot i { width:24px; height:24px; border-radius:50%; background:#e6eaee; color:var(--dim);
           display:grid; place-items:center; font-size:12px; font-weight:700; font-style:normal; }
  .dot.on i { background:var(--brand); color:#fff; }
  .dot.on { color:var(--ink); font-weight:600; }
  .dot.done i { background:#d9efe4; color:var(--ok); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:26px; box-shadow:0 1px 2px rgba(16,32,48,.04); }
  h2 { font-size:20px; margin:0 0 6px; }
  .sub { color:var(--dim); font-size:15px; margin:0 0 20px; }
  label { display:block; font-weight:600; font-size:15px; margin:18px 0 6px; }
  .tip { font-weight:400; color:var(--dim); font-size:13px; margin:2px 0 8px; }
  textarea, input[type=text], select {
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:9px;
    font:15px inherit; background:#fff; color:var(--ink); }
  textarea { resize:vertical; line-height:1.5; }
  select { appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
           linear-gradient(135deg,var(--dim) 50%,transparent 50%);
           background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%;
           background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  .file { border:1.5px dashed #c8d2dc; border-radius:10px; padding:16px; text-align:center;
          color:var(--dim); font-size:14px; background:#fbfcfd; }
  .file input { display:none; }
  .file label { display:inline-block; margin:0; color:var(--brand); cursor:pointer;
                font-weight:600; text-decoration:underline; }
  button { background:var(--brand); color:#fff; border:0; border-radius:9px;
           padding:13px 22px; font:16px inherit; font-weight:600; cursor:pointer; width:100%; }
  button:hover { filter:brightness(1.07); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  button.link { background:none; color:var(--dim); text-decoration:underline; font-weight:400;
                font-size:14px; padding:10px 0 0; }
  .q { padding:18px 0; border-bottom:1px solid var(--line); }
  .q:last-of-type { border-bottom:0; }
  .q .label { font-weight:600; margin-bottom:10px; }
  .yn { display:flex; gap:10px; }
  .yn button { background:#eef1f5; color:var(--ink); font-weight:600; width:auto; flex:1;
               padding:11px 0; border:1.5px solid transparent; }
  .yn button.sel { background:#e8f0fd; border-color:var(--brand); color:var(--brand); }
  .letter { white-space:pre-wrap; font:16px/1.75 Georgia,"Times New Roman",serif;
            background:#fffdf9; border:1px solid #ece4d5; border-radius:11px; padding:24px; }
  .grounds { list-style:none; padding:0; margin:0 0 20px; }
  .grounds li { padding:9px 0 9px 26px; border-bottom:1px solid var(--line); font-size:15px;
                position:relative; }
  .grounds li:before { content:"✓"; position:absolute; left:2px; color:var(--ok); font-weight:700; }
  .grounds li:first-child { font-weight:600; }
  .note { background:var(--warnbg); border:1px solid #f0e0b8; color:var(--warn);
          border-radius:9px; padding:12px 14px; font-size:13.5px; margin-bottom:20px; }
  .err { background:#fdeceb; border:1px solid #f3c7c3; color:#a32b20; border-radius:9px;
         padding:12px 14px; font-size:14px; margin-top:18px; white-space:pre-wrap; }
  .spin { text-align:center; color:var(--dim); padding:34px 0; }
  .spin b { display:block; color:var(--ink); font-size:17px; margin-bottom:4px; }
  .actions { display:flex; gap:10px; margin-top:22px; }
  .actions button { width:auto; flex:1; }
  .actions button.ghost { background:#eef1f5; color:var(--ink); }
  footer { text-align:center; color:var(--dim); font-size:12.5px; margin-top:26px; line-height:1.7; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Appeal your parking charge</h1>
    <p>Upload the notice, answer a couple of questions, get a letter you can send.</p>
  </header>
  <div class="steps" id="steps"></div>
  <div class="card" id="view"></div>
  <div id="error"></div>
  <footer>
    This produces a draft for you to check and send yourself. It is not legal advice.<br>
    <span id="provider"></span>
  </footer>
</div>

<script>
const SAMPLE = `PARKING CHARGE NOTICE
Operator Name: Acme Parking Ltd
PCN Number: PCN778899
Vehicle Registration: KX19 PLT
Location: Riverside Retail Park
Postcode: M1 4BT
Date of Contravention: 12/06/2026
Date of Issue: 02/07/2026
Entry Time: 14:05
Exit Time: 16:58
Charge: 100
Alleged Breach: Overstayed the maximum permitted period
Trade Association: BPA`;

const S = { step: 0, caseId: null, questions: [], picked: {}, result: null, docText: "", filename: "" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: body ? {"content-type":"application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await r.text();
  let d; try { d = text ? JSON.parse(text) : {}; } catch { d = {}; }
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Please try again.");
  return d;
}

function fail(e) { $("error").innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
function clearError() { $("error").innerHTML = ""; }

function renderSteps() {
  const names = ["Upload", "Questions", "Your letter"];
  $("steps").innerHTML = names.map((n, i) => {
    const cls = i < S.step ? "done" : i === S.step ? "on" : "";
    return `<span class="dot ${cls}"><i>${i < S.step ? "✓" : i + 1}</i>${n}</span>`;
  }).join("");
}

// ---------------------------------------------------------------- 1. upload
function viewUpload() {
  return `
    <h2>Upload your parking notice</h2>
    <p class="sub">We read the notice to find the operator, the dates and what you are accused of.</p>
    <div class="file">
      <input type="file" id="file" accept=".txt,.text,.md">
      <label for="file">Choose a text file</label> — or paste the notice below
      <div id="fname" class="tip"></div>
    </div>
    <label for="doc">The notice</label>
    <div class="tip">Type or paste everything printed on it, including the dates and reference number.</div>
    <textarea id="doc" rows="11">${esc(S.docText || SAMPLE)}</textarea>
    <label for="narr">What happened?</label>
    <div class="tip">In your own words. A sentence or two is plenty.</div>
    <textarea id="narr" rows="3" placeholder="e.g. the letter only arrived weeks later, and there was a long queue at the exit barrier"></textarea>
    <div class="actions"><button onclick="submitUpload(this)">Check my notice</button></div>`;
}

function wireFile() {
  const f = $("file");
  if (!f) return;
  f.onchange = () => {
    const file = f.files[0];
    if (!file) return;
    S.filename = file.name;
    const reader = new FileReader();
    reader.onload = () => { $("doc").value = reader.result; $("fname").textContent = file.name; };
    reader.readAsText(file);
  };
}

async function submitUpload(btn) {
  clearError();
  S.docText = $("doc").value.trim();
  const narrative = $("narr").value.trim();
  if (!S.docText) { fail(new Error("Please paste the notice first.")); return; }
  await busy(btn, "Reading your notice", async () => {
    const res = await api("POST", "/appeal", {
      documents: [{evidence_id: "E1", filename: S.filename || "notice.txt",
                   text: S.docText, kind: "OTHER"}],
      narrative,
    });
    S.caseId = res.case_id;
    handle(res);
  });
}

// ------------------------------------------------------------- 2. questions
function viewQuestions() {
  return `
    <h2>A few quick questions</h2>
    <p class="sub">These are the only things we still need. Skip any you are unsure about —
      we simply will not make that argument.</p>
    ${S.questions.map(q => `
      <div class="q"><div class="label">${esc(q.text)}</div>${input(q)}</div>`).join("")}
    <div class="actions">
      <button onclick="submitAnswers(this)">Continue</button>
      <button class="ghost" onclick="skipAll(this)">Skip these</button>
    </div>`;
}

function input(q) {
  const v = S.picked[q.fact];
  if (q.type === "bool") return `
    <div class="yn" id="yn-${q.fact}">
      <button type="button" class="${v === "yes" ? "sel" : ""}" onclick="pick('${q.fact}','yes')">Yes</button>
      <button type="button" class="${v === "no" ? "sel" : ""}" onclick="pick('${q.fact}','no')">No</button>
    </div>`;
  if (q.type === "int") return `<input type="text" inputmode="numeric" id="f-${q.fact}"
    value="${esc(v || "")}" placeholder="Number of minutes">`;
  if (q.type === "choice") return `<select id="f-${q.fact}"><option value="">Choose one…</option>${
    (q.options || []).map(o => `<option value="${esc(o)}" ${v === o ? "selected" : ""}>${esc(pretty(o))}</option>`).join("")}</select>`;
  return `<input type="text" id="f-${q.fact}" value="${esc(v || "")}">`;
}

const pretty = (o) => String(o).replace(/_/g, " ").toLowerCase().replace(/^./, c => c.toUpperCase());

function pick(fact, value) {
  S.picked[fact] = S.picked[fact] === value ? undefined : value;
  render();
}

function collect() {
  const out = {};
  for (const q of S.questions) {
    if (q.type === "bool") { if (S.picked[q.fact]) out[q.fact] = S.picked[q.fact]; continue; }
    const el = $(`f-${q.fact}`);
    if (!el || !el.value.trim()) continue;
    out[q.fact] = q.type === "int" ? Number(el.value) : el.value;
  }
  return out;
}

async function submitAnswers(btn) {
  clearError();
  const answers = collect();
  if (!Object.keys(answers).length) { await skipAll(btn); return; }
  await busy(btn, "Building your appeal", async () => {
    handle(await api("POST", `/appeal/${S.caseId}`, {answers}));
  });
}

async function skipAll(btn) {
  clearError();
  await busy(btn, "Building your appeal", async () => {
    // skip:true tells the engine to stop asking. The facts stay absent, so any
    // ground they gate simply never fires - the letter is narrower, not weaker.
    handle(await api("POST", `/appeal/${S.caseId}`, {answers: collect(), skip: true}), true);
  });
}

// ---------------------------------------------------------------- 3. letter
function viewLetter() {
  const r = S.result || {};
  if (r.state !== "RELEASED") return `
    <h2>We need a person to check this one</h2>
    <p class="sub">Our automatic checks were not satisfied that every point in the draft was fully
      supported, so we have not produced a letter rather than send you something we cannot stand
      behind. A case handler will review it.</p>
    <div class="actions"><button class="ghost" onclick="location.reload()">Start again</button></div>`;
  return `
    <h2>Your appeal is ready</h2>
    <p class="sub">Check it reads correctly, then send it to the operator before your deadline.</p>
    ${(r.grounds || []).length ? `<ul class="grounds">${r.grounds.map(g =>
      `<li>${esc(g)}</li>`).join("")}</ul>` : ""}
    ${(r.evidence_list || []).length ? `<p class="sub">Attach: ${esc(r.evidence_list.join(", "))}</p>` : ""}
    <div class="letter" id="letter">${esc(r.letter || "")}</div>
    <div class="actions">
      <button onclick="copyLetter(this)">Copy letter</button>
      <button class="ghost" onclick="downloadLetter()">Download</button>
    </div>
    <button class="link" onclick="location.reload()">Appeal another notice</button>`;
}

function copyLetter(btn) {
  navigator.clipboard.writeText((S.result || {}).letter || "");
  const t = btn.textContent; btn.textContent = "Copied";
  setTimeout(() => { btn.textContent = t; }, 1300);
}

function downloadLetter() {
  const blob = new Blob([(S.result || {}).letter || ""], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "parking-appeal.txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ------------------------------------------------------------------- shared
function handle(res, forceFinish) {
  S.result = res;
  const qs = res.questions || [];
  if (qs.length && !forceFinish) { S.questions = qs; S.step = 1; }
  else { S.step = 2; }
  render();
}

async function busy(btn, message, fn) {
  const view = $("view");
  const restore = view.innerHTML;
  view.innerHTML = `<div class="spin"><b>${esc(message)}…</b>This takes a few seconds.</div>`;
  try { await fn(); }
  catch (e) { view.innerHTML = restore; wireFile(); fail(e); }
}

function render() {
  renderSteps();
  $("view").innerHTML = S.step === 0 ? viewUpload() : S.step === 1 ? viewQuestions() : viewLetter();
  wireFile();
}

(async () => {
  render();
  try {
    const h = await api("GET", "/health");
    if (h.provider !== "openai") {
      $("view").insertAdjacentHTML("afterbegin",
        `<div class="note"><b>Demo mode.</b> No working OpenAI key is configured, so the notice is
         read by a simple text matcher instead of a model${h.provider_note ? ` (${esc(h.provider_note)})` : ""}.
         The legal reasoning and the letter are unaffected.</div>`);
    }
    $("provider").textContent = h.provider === "openai"
      ? `Reading notices with ${h.models.extraction || "OpenAI"}.`
      : "Running without a model (demo mode).";
  } catch { /* the banner is optional; never block the journey on it */ }
})();
</script>
</body>
</html>
