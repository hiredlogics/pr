# Approved drafting building blocks - all 70 records in KB Appendix A.
# Text of every block added in this pass is VERBATIM from the controlled source;
# it must not be reworded, tidied or re-punctuated. (The 30 pre-existing entries
# are left exactly as they were - a few were lightly trimmed before this pass.)
# requires_evidence_any: block may only be used if one of these evidence kinds is uploaded.
# requires_facts: block embeds a FACTUAL claim, so it is withheld unless every listed fact is truthy.
#   (Review finding: several Appendix A blocks assert facts - "verified congestion", "valid permit",
#    "more than one occasion" - that the module gate alone does not prove.)
blocks:
  PP-INTRO-001: {text: "I write as the registered keeper of vehicle {{vrm}} in respect of Parking Charge Notice {{pcn_number}}. I dispute liability for this parking charge and require the operator to consider this appeal on the grounds set out below."}
  PP-INTRO-002: {text: "This appeal is submitted by the registered keeper. No admission is made as to the identity of the driver, and nothing contained within this appeal should be interpreted as identifying or inferring the identity of the driver."}
  PP-POFA-001: {text: "Where the operator seeks to recover the parking charge from the registered keeper rather than the driver, it must establish that the statutory conditions for keeper liability under Schedule 4 of the Protection of Freedoms Act 2012 have been satisfied. Keeper liability does not arise merely because an individual is the registered keeper."}
  PP-POFA-003: {text: "The Notice to Keeper was not delivered within the applicable statutory period for the relevant postal-notice route. The operator has therefore failed to satisfy a condition required to transfer liability to the registered keeper under Schedule 4."}
  PP-POFA-004: {text: "Where a Notice to Driver preceded the Notice to Keeper, the subsequent notice must comply with the separate timing requirements applicable to that route. The notice in this case did not meet the applicable statutory timing requirement and keeper liability has not been established."}
  PP-POFA-006: {text: "The operator has not established the identity of the driver. As the applicable Schedule 4 requirements have also not been satisfied, liability cannot be transferred to the registered keeper under Schedule 4."}
  PP-POFA-007: {text: "For the verified reasons set out above, the operator has not established keeper liability under Schedule 4 of the Protection of Freedoms Act 2012. The charge should therefore be cancelled as against the registered keeper."}
  PP-POFA-008: {text: "The notice identifies the registered keeper as a vehicle-hire firm. Where Schedule 4 is relied upon against a hire-firm keeper, the operator must also satisfy the hire-specific documentary conditions. Those documents have not been evidenced in the materials supplied with this appeal.", requires_facts: [keeper_is_hire_firm]}
  PP-PAY-001: {text: "The allegation that the applicable parking tariff was not paid is disputed. A payment was made in connection with the vehicle's use of the site. The operator should review its payment records against the parking event before continuing enforcement."}
  PP-PAY-002: {text: "Evidence confirming payment is supplied with this appeal. It should be considered alongside the operator's transaction records and the details of the alleged parking event.", requires_evidence_any: [RECEIPT, APP_SCREENSHOT, BANK_STATEMENT]}
  PP-PAY-006: {text: "The operator is requested to conduct a reasonable search of its payment records for the relevant location and period, including transactions capable of being matched to the parking event rather than relying solely on an immediate VRM match."}
  PP-KEY-002: {text: "The discrepancy concerns a minor registration-entry error. Payment was nevertheless made. The operator should match the transaction and deal with the case in accordance with the applicable current keying-error requirements."}
  PP-KEY-004: {text: "Notwithstanding the registration-entry error, the applicable tariff was paid. The case should not be treated as though the parking facility was used without payment.", requires_facts: [payment_made]}
  PP-CON-001: {text: "The vehicle's recorded presence must be considered in the context of the applicable consideration period. Entry onto controlled land does not, without more, establish immediate acceptance of every parking term or that the entire entry-to-exit interval was a period of parking."}
  PP-CON-005: {text: "Part of the recorded presence was spent entering, manoeuvring and attempting to locate a suitable space. Camera entry time is not automatically the start of actual parking.", requires_facts: [time_spent_finding_space]}
  PP-GRACE-001: {text: "The applicable current Code requirements provide for a grace period in relevant circumstances in addition to the parking period. The operator must assess the alleged additional time against the rule actually applicable to this event."}
  PP-GRACE-003: {text: "The vehicle's departure was affected by verified congestion or delay in exiting. An ANPR exit timestamp records passage at the camera and does not necessarily establish that the vehicle remained parked until that moment.", requires_facts: [exit_congestion]}
  PP-ANPR-001: {text: "ANPR images record the vehicle at particular points on the controlled land. Those timestamps do not necessarily establish the precise period actually parked."}
  PP-ANPR-003: {text: "The vehicle attended the location on more than one separate occasion. The first recorded entry and final recorded exit must not be treated as one continuous parking event without review of the complete sequence.", requires_facts: [multiple_visits]}
  PP-ANPR-005: {text: "The operator should review the complete sequence of captures for the vehicle and date, including intermediate entry/exit records, rather than relying only on the two images reproduced on the PCN."}
  PP-AUTH-002: {text: "A valid parking permit existed in connection with the vehicle's use of the location. The existence and scope of that underlying entitlement must be considered.", requires_facts: [permit_held]}
  PP-AUTH-004: {text: "Although there was an identified display or registration issue, a valid underlying entitlement to park existed. The operator should distinguish this from a case involving no parking authority.", requires_facts: [permit_display_issue]}
  PP-SIGN-001: {text: "The adequacy of the signage is disputed on the specific factual basis identified. The operator should review the positioning, visibility, content and material-time condition of the signs relied upon."}
  PP-LAND-001: {text: "The operator is requested to establish that it had sufficient authority from the landowner or other entitled party to operate and enforce the parking scheme at the location on the material date."}
  # Proportionate records request. Does NOT assert that validation, payment or
  # authorisation occurred - only that the operator should review the systems
  # the allegation itself depends on, against the verified visit facts.
  PP-REC-001: {text: "The allegation turns on whether a required validation, authorisation or payment step was completed at the site. The materials available to the keeper do not establish that step one way or the other. The operator is requested to review its validation, kiosk, permit and transaction records for the vehicle, location and material date, and to explain the specific records relied upon before maintaining the charge."}
  PP-END-001: {text: "For the reasons set out above, the parking charge is disputed and the operator is requested to cancel Parking Charge Notice {{pcn_number}}."}
  PP-END-002: {text: "If the operator is not prepared to cancel the charge, it is requested to provide a clear response addressing the specific grounds and evidence raised."}
  AI-BREAK-001: {text: "The vehicle became mechanically immobilised during the relevant period. The incident was outside the ordinary control of the person responsible for the vehicle and materially prevented timely departure. The operator is requested to apply the breakdown provisions of the current applicable Code to the enclosed evidence and cancel the charge where those provisions are satisfied.", requires_facts: [immobilisation_prevented_departure], requires_evidence_any: [RECOVERY_REPORT, GARAGE_INVOICE, CALL_LOG]}
  AI-BREAK-002: {text: "The alleged breach arose, if at all, only because an unforeseen mechanical event prevented the vehicle from being moved as required. The operator is requested to address the legal effect of that supervening event and the evidence of genuine immobilisation rather than treating the additional presence as a voluntary decision to remain parked."}
  AI-RES-001: {text: "The vehicle was parked pursuant to pre-existing residential parking rights evidenced by the uploaded {{lease_or_tenancy}}. The operator's signage cannot simply be assumed to vary or extinguish rights already granted under that agreement. The operator is requested to address the specific parking clause and explain the contractual basis on which the later parking scheme is said to override or modify it.", requires_evidence_any: [LEASE, TENANCY]}
  AI-RES-003: {text: "The relevant agreement grants or identifies parking rights connected with the allocated space {{allocated_bay}}. The operator must address those pre-existing rights before treating the vehicle as an unauthorised user of that space.", requires_evidence_any: [LEASE, TENANCY]}
  AI-EQ-001: {text: "The circumstances required additional time connected with a disability-related need. The operator is requested to consider whether its service and enforcement process required a reasonable adjustment rather than determining the charge solely by automated timestamps."}

  # ---------------------------------------------------------------- added: remaining Appendix A blocks
  PP-POFA-002: {text: "The registered keeper has not received a Notice to Keeper capable of establishing keeper liability under Schedule 4. In the absence of compliance with the statutory procedure required to transfer liability, the operator has not established a right to recover this charge from the registered keeper under Schedule 4.", requires_facts: [ntk_not_received]}
  PP-POFA-005A: {text: "The Notice to Keeper fails to provide the route-specific information required by Schedule 4 concerning the alleged parking event. The precise defect identified by the system should be stated here; this block must never be used from OCR uncertainty alone.", requires_facts: [ntk_defect_parking_details]}
  PP-POFA-005B: {text: "The Notice to Keeper does not contain a compliant route-specific keeper-liability warning. The operator cannot rely upon Schedule 4 where the applicable statutory conditions have not been met.", requires_facts: [ntk_defect_keeper_warning]}
  PP-POFA-005C: {text: "The notice does not comply with the applicable requirement concerning identification of the creditor. If the operator relies on Schedule 4, it must establish compliance with the route-specific statutory requirements.", requires_facts: [ntk_defect_creditor]}
  PP-POFA-005D: {text: "The notice does not properly comply with the applicable Schedule 4 requirement concerning the unpaid parking charge said to be outstanding. This point may be used only after the exact statutory defect is verified.", requires_facts: [ntk_defect_charge_amount]}
  PP-POFA-005E: {text: "The notice does not contain the applicable statutory invitation required by the relevant Schedule 4 route. The system must identify the exact missing/defective requirement before using this point.", requires_facts: [ntk_defect_statutory_invitation]}
  PP-PAY-003: {text: "A genuine attempt was made to comply with the payment arrangements, but the payment machine did not operate as expected. The operator should review its machine fault, maintenance and transaction records for the relevant time.", requires_facts: [payment_attempt_failed]}
  PP-PAY-004: {text: "A genuine attempt was made to use the digital payment facility provided for the location, but the transaction could not be completed because of the identified system problem. The operator should review its relevant system and transaction records.", requires_facts: [payment_attempt_failed]}
  PP-PAY-005: {text: "The circumstances demonstrate a genuine attempt to comply with the payment requirements. The charge should not be considered in isolation from the steps taken to make payment and the verified reason the transaction could not be completed.", requires_facts: [payment_attempt_failed]}
  PP-KEY-001: {text: "A parking payment was made, but an error occurred when the vehicle registration details were entered. The operator should identify the corresponding transaction and apply the current applicable Code/Appeals Charter treatment.", requires_facts: [payment_made]}
  PP-KEY-003: {text: "Payment was made but registration details relating to another vehicle were entered. The operator should examine the relevant transaction and apply the applicable current Code treatment.", requires_facts: [payment_made, vrm_entered_is_known_vehicle]}
  PP-CON-002: {text: "Time was required to locate and consider the applicable parking terms before a decision could reasonably be made whether to accept them.", requires_facts: [short_presence_before_acceptance]}
  PP-CON-003: {text: "Having considered the terms, they were not accepted and the vehicle left. The initial presence should not automatically be treated as an accepted parking contract.", requires_facts: [no_parking_took_place, short_presence_before_acceptance]}
  PP-CON-004: {text: "Part of the recorded period was spent attempting to understand and comply with the payment arrangements. The operator should not automatically treat the camera entry time as the commencement of paid parking.", requires_facts: [payment_attempt_failed]}
  PP-GRACE-002: {text: "The period following the permitted parking session included time reasonably required to return to the vehicle, prepare to leave and exit the controlled land.", requires_facts: [permitted_period_ended]}
  PP-GRACE-004: {text: "Additional time was reasonably required before the vehicle could leave. The operator should consider the verified circumstances together with the applicable Code requirement rather than relying solely on an automated timestamp comparison.", requires_facts: [exit_delay_min]}
  # ORPHAN BY DESIGN: asserts the period falls WITHIN the applicable grace.
  #   No engine computes that, so this block is deliberately referenced by no
  #   module (kept for a future grace calculator). See report note.
  PP-GRACE-005: {text: "The verified additional period falls within the grace period applicable to this parking event. The charge should therefore be cancelled.", requires_facts: [permitted_period_ended, exit_delay_min]}
  PP-ANPR-002: {text: "The alleged parking duration is disputed. The operator should establish the actual parking period relied upon rather than merely the elapsed interval between two camera timestamps."}
  PP-ANPR-004: {text: "Independent evidence demonstrates that the vehicle was not continuously present for the period alleged. The operator must reconcile that evidence with its ANPR sequence.", requires_evidence_any: [DASHCAM, PHOTO, RECEIPT, LOCATION_RECORD, BANK_STATEMENT], requires_facts: [independent_evidence_contradicts]}
  PP-ANPR-007: {text: "A specific discrepancy has been identified in the timestamps relied upon. Because duration depends on those timestamps, the operator should verify the relevant records and explain the discrepancy.", requires_facts: [anpr_discrepancy]}
  PP-ANPR-008: {text: "The photographic evidence does not clearly establish the registration details relied upon. The operator should review the original images and confirm the basis on which the VRM was identified.", requires_facts: [anpr_discrepancy]}
  PP-ANPR-010: {text: "The sequence appears incomplete. Absence of an intermediate capture should not automatically be treated as proof of continuous presence.", requires_facts: [anpr_sequence_incomplete]}
  PP-ANPR-011: {text: "The evidence indicates that separate visits may have been paired into a single event. The operator should establish that the selected entry and exit genuinely relate to one continuous visit.", requires_facts: [anpr_sequence_incomplete]}
  # NOT from Appendix A. Authored in-repo for KB-BAY-01 and signed off on
  # 2026-09-28, because the KB had no ground at all for a bay-eligibility
  # allegation. Keep it out of any "verbatim from the controlled source" audit.
  # requires_facts deliberately omits observation_window_min: R-08b tests the
  # fact for truthiness and a window of 0 minutes - a single instant, the
  # strongest version of this argument - is falsy and would withhold the block.
  # The numeric test lives in KB-BAY-01's gate instead.
  PP-BAY-001: {text: "The operator's records show an observation time of {{observation_time}} and an event time of {{event_time}}. A restriction of this kind turns on who was using the bay over the course of the visit, so a record spanning only that interval does not of itself establish the alleged breach. The operator is requested to produce the evidence on which it concluded that the conditions of use for the bay were not met.", requires_facts: [restricted_bay_alleged]}
  # Professional system proposition only — never embed customer free text.
  # material_account_proposition is authored by engines/account.py from structured
  # free-text extraction (source=CUSTOMER_FREE_TEXT); customer words stay in audit.
  PP-BAY-002: {text: "Further, the information available to the registered keeper indicates that {{material_account_proposition}}. That is inconsistent with the factual premise of the allegation that the bay's conditions of use were unmet. The operator is requested to identify the evidence relied upon to conclude otherwise.", requires_facts: [account_contradicts_allegation, material_account_proposition]}
  PP-AUTH-001: {text: "The vehicle was authorised to park at the material time. The operator should review the relevant authorisation records and evidence before maintaining an allegation of unauthorised parking.", requires_facts: [authorisation_source]}
  PP-AUTH-006: {text: "The vehicle was present as an authorised visitor. The operator should review visitor records and the evidence of permission.", requires_facts: [visitor_authorised]}
  # ORPHAN BY DESIGN: the verbatim phrase "not an automatic cancellation
  #   ground" trips validation.py BREAK_AUTO, which would block release. Kept
  #   verbatim and referenced by no module until that is resolved.
  PP-AUTH-008: {text: "The vehicle's presence was connected with a genuine visit to the premises for which the parking facility was provided. This is not an automatic cancellation ground; it should be used where site terms/policy or landholder authorisation make it relevant.", requires_facts: [genuine_customer, customer_only_site]}
  PP-SIGN-002: {text: "The parking terms were not adequately communicated on the route of entry in the circumstances established by the evidence. The operator should identify the entrance signage actually in place at the material time.", requires_evidence_any: [PHOTO], requires_facts: [signage_issue_raised]}
  PP-SIGN-004: {text: "The particular term said to have been breached was not displayed with sufficient prominence or clarity in the circumstances established. The operator should identify precisely where and how that term was communicated.", requires_evidence_any: [PHOTO], requires_facts: [signage_issue_type]}
  PP-SIGN-005: {text: "The parking charge itself was not displayed with sufficient prominence on the signage relied upon. Use only where the actual sign evidence supports this factual proposition.", requires_evidence_any: [PHOTO], requires_facts: [signage_issue_type]}
  PP-SIGN-011: {text: "The signage communicated materially inconsistent terms. The operator should explain which terms it says applied and how they were communicated with sufficient clarity.", requires_evidence_any: [PHOTO], requires_facts: [signage_issue_type]}
  PP-LAND-002: {text: "Any authority relied upon should cover the specific location and material date. Evidence for another site or period does not establish authority for this PCN."}
  PP-LAND-005: {text: "The operator must establish that the authority relied upon covers the specific land on which the alleged event occurred."}
  PP-LAND-006: {text: "Any evidence of authority must show that the operator's authority was in force on {{parking_event_date}}.", requires_facts: [parking_event_date]}
  PP-LAND-008: {text: "Where authority evidence is supplied but redactions prevent verification of parties, land, period or enforcement scope, the operator should provide sufficient evidence to establish those matters.", requires_facts: [authority_evidence_redacted]}
  # structural next-step wording; used by the renderer, not by a module.
  PP-END-003: {text: "If rejected, please provide the appropriate information/reference required to pursue the applicable independent appeal route."}
  AI-RES-002: {text: "The relevant agreement grants a right to park in terms that do not contain the restriction now alleged. The operator is requested to address the scope of that grant and identify any valid contractual mechanism said to have introduced the additional restriction. Use only when the uploaded instrument genuinely supports this proposition.", requires_evidence_any: [LEASE, TENANCY], requires_facts: [lease_parking_clause_found]}
  AI-RES-004: {text: "The uploaded agreement confers a parking benefit. Where the later parking arrangement substantially interferes with the exercise of that granted right, the operator is requested to address the principle that a grantor cannot substantially deprive the grantee of the benefit already conferred. Use only after legal/factual validation.", requires_evidence_any: [LEASE, TENANCY], requires_facts: [substantial_interference]}
  # Verbatim text invokes "Equality Act obligations", which validation.py
  #   VAL-EQ will not allow without the triggering fact, so disability_extra_time
  #   is required here (Appendix B: Equality Act only if relevant facts exist).
  AI-HOSP-001: {text: "The parking event was connected with verified hospital/medical attendance and the timing issue arose from the identified clinical/emergency circumstances. The operator should apply the site's relevant exemption/validation rules and any applicable Code or Equality Act obligations.", requires_facts: [hospital_attendance, disability_extra_time]}
  AI-ACT-001: {text: "The vehicle's presence was connected with genuine loading/unloading activity. The operator should assess the actual site terms and the factual distinction between temporary stopping for that activity and ordinary parking, rather than assuming that every stationary period is parking.", requires_facts: [loading_activity]}
  AI-EVCH-001: {text: "The vehicle's presence was connected with a genuine charging session. The operator should distinguish the charging terms from any separate parking terms and reconcile the charge-session records with the allegation.", requires_facts: [ev_charging_session]}
