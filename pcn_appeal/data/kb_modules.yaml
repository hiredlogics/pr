  - module_id: KB-KEY-02
    route: KEYING
    topic: "Different vehicle registration entered"
    use_when: {all: [{is: payment_made}, {eq: [keying_error_type, DIFFERENT_VEHICLE]}]}
    do_not_use_when: {always: false}
    core_proposition: "Require transaction matching and analyse applicable Code treatment; do not describe the event as simply unpaid parking where tariff was paid."
    required_facts: [vrm, vrm_entered, payment_made, vrm_entered_is_known_vehicle]
    evidence_helpful: [RECEIPT, APP_SCREENSHOT, BANK_STATEMENT]
    legal_basis: [SCOP-keying]
    legal_basis_origin: SOURCE_REGISTER
    drafting_notes: Code treatment of a different-vehicle entry is not the same as a minor keying error - do not claim the minor-error outcome.
    prohibited_claims: [unpaid parking, automatically cancels]
    building_blocks: [PP-KEY-001, PP-KEY-003, PP-KEY-004]
    strength: 80
    status: ACTIVE
    version: "1.1"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 5. Payment, Keying and Systems / KB-KEY-02"
