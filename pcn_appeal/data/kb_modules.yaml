# Structured KB modules converted from "Private Parking AI Legal Knowledge Base V2".
# use_when / do_not_use_when are machine predicates (see rules/dsl.py).
# This file is a representative subset; convert every KB-* record the same way.
modules:
  - module_id: KB-POFA-01
    route: POFA
    topic: Keeper liability threshold
    use_when: {all: [{eq: [driver_status, UNIDENTIFIED]}, {eq: [jurisdiction, ENGLAND_WALES]}]}
    do_not_use_when: {eq: [relevant_land, false]}
    core_proposition: Keeper liability is not automatic; if the operator seeks recovery from the keeper under Schedule 4 the statutory conditions must be satisfied.
    required_facts: [notice_route, parking_event_date, notice_issue_date]
    evidence_helpful: [PCN, NTK]
    legal_basis: [PoFA-2012-Sch4]
    drafting_notes: State that liability cannot transfer to the keeper; never that the charge is void.
    prohibited_claims: [charge automatically invalid]
    building_blocks: [PP-INTRO-002, PP-POFA-001]
    strength: 40
  - module_id: KB-POFA-02
    route: POFA
    topic: Postal NTK timing
    use_when: {all: [{eq: [pofa_route, POSTAL]}, {in: [pofa_finding, [POFA_POSTAL_LATE]]}]}
    do_not_use_when: {eq: [driver_status, FORMALLY_IDENTIFIED]}
    core_proposition: The NTK was not given within the statutory period for the postal route, so keeper liability is not established under Schedule 4.
    required_facts: [parking_event_date, notice_issue_date]
    evidence_helpful: [NTK]
    legal_basis: [PoFA-2012-Sch4-para9]
    drafting_notes: Only after deterministic timing calculation confirms the failure.
    prohibited_claims: []
    building_blocks: [PP-POFA-003, PP-POFA-006, PP-POFA-007]
    strength: 95
  - module_id: KB-POFA-03
    route: POFA
    topic: Windscreen notice then NTK
    use_when: {all: [{eq: [pofa_route, WINDSCREEN]}, {in: [pofa_finding, [POFA_NTD_NTK_LATE, POFA_NTD_NTK_TOO_EARLY]]}]}
    do_not_use_when: {eq: [driver_status, FORMALLY_IDENTIFIED]}
    core_proposition: The NTK following a Notice to Driver did not meet the route-specific timing requirement.
    required_facts: [ntd_date, notice_issue_date]
    evidence_helpful: [NTK]
    legal_basis: [PoFA-2012-Sch4-para8]
    drafting_notes: Verified finding only.
    prohibited_claims: []
    building_blocks: [PP-POFA-004, PP-POFA-006, PP-POFA-007]
    strength: 95

  - module_id: KB-PAY-01
    route: PAYMENT
    topic: Payment made
    use_when: {is: payment_made}
    do_not_use_when: {is: terms_rejected_left}
    core_proposition: Lead with payment and require the operator to reconcile its transaction records with the parking event.
    required_facts: [payment_made, payment_method]
    evidence_helpful: [RECEIPT, APP_SCREENSHOT, BANK_STATEMENT]
    legal_basis: [SCOP-payment]
    drafting_notes: Merge repeated payment statements into one.
    prohibited_claims: []
    building_blocks: [PP-PAY-001, PP-PAY-002, PP-PAY-006]
    strength: 85
  - module_id: KB-KEY-01
    route: KEYING
    topic: Minor keying error
    use_when: {all: [{is: payment_made}, {eq: [keying_error_type, MINOR]}]}
    do_not_use_when: {always: false}
    core_proposition: Treat as a paid event with a registration mismatch and apply the applicable Code keying-error requirements.
    required_facts: [vrm, vrm_entered, keying_error_type]
    evidence_helpful: [RECEIPT, APP_SCREENSHOT]
    legal_basis: [SCOP-keying]
    drafting_notes: Keying and payment are one case theory - do not repeat.
    prohibited_claims: []
    building_blocks: [PP-KEY-002, PP-KEY-004]
    strength: 90

  - module_id: KB-BREAK-01
    route: BREAKDOWN
    topic: Mechanical breakdown
    use_when: {all: [{is: vehicle_immobilised}, {is: immobilisation_prevented_departure}]}
    do_not_use_when: {is: fault_pre_existing_not_preventing}
    core_proposition: An unforeseen supervening event outside control made departure impossible or materially prevented it; frame as a substantive contractual issue where the facts support it.
    required_facts: [vehicle_immobilised, immobilisation_cause, immobilisation_prevented_departure]
    evidence_helpful: [RECOVERY_REPORT, GARAGE_INVOICE, CALL_LOG, PHOTO]
    legal_basis: [CL-frustration-impossibility, SCOP-breakdown]
    drafting_notes: Never 'breakdown = automatic frustration'. Conclusion must follow the facts.
    prohibited_claims: [automatically frustrated, automatically void]
    building_blocks: [AI-BREAK-001, AI-BREAK-002]
    strength: 85
  - module_id: KB-BREAK-03
    route: BREAKDOWN
    topic: Recovery / assistance time
    use_when: {all: [{is: vehicle_immobilised}, {is: recovery_attended}]}
    do_not_use_when: {always: false}
    core_proposition: Separate time caused by necessary recovery arrangements from voluntary parking.
    required_facts: [recovery_attended]
    evidence_helpful: [RECOVERY_REPORT]
    legal_basis: [SCOP-breakdown]
    drafting_notes: Refer to recovery evidence accurately.
    prohibited_claims: []
    building_blocks: [AI-BREAK-002]
    strength: 70

  - module_id: KB-RES-01
    route: RESIDENTIAL
    topic: Primacy of pre-existing parking rights
    use_when: {all: [{in: [resident_status, [RESIDENT, TENANT, LEASEHOLDER]]}, {is: lease_parking_clause_found}]}
    do_not_use_when: {always: false}
    core_proposition: The actual lease/tenancy is the starting point; later operator signage should not be assumed to vary or extinguish pre-existing rights.
    required_facts: [resident_status, lease_parking_clause_found]
    evidence_helpful: [LEASE, TENANCY]
    legal_basis: [CL-primacy-of-contract]
    drafting_notes: Quote only verbatim uploaded clause text.
    prohibited_claims: [unfettered]
    building_blocks: [AI-RES-001]
    strength: 90
  - module_id: KB-RES-03
    route: RESIDENTIAL
    topic: Allocated bay
    use_when: {all: [{is: lease_parking_clause_found}, {exists: allocated_bay}]}
    do_not_use_when: {always: false}
    core_proposition: Analyse the resident's rights in the identified bay and whether the operator can impose the alleged additional term.
    required_facts: [allocated_bay]
    evidence_helpful: [LEASE, SITE_PLAN]
    legal_basis: [CL-primacy-of-contract]
    drafting_notes: Bay reference must come from the lease or plan.
    prohibited_claims: []
    building_blocks: [AI-RES-003]
    strength: 80
  - module_id: KB-RES-06
    route: RESIDENTIAL
    topic: Permit scheme expressly incorporated
    use_when: {all: [{is: lease_parking_clause_found}, {is: lease_has_regulations_clause}]}
    do_not_use_when: {always: false}
    core_proposition: Confront the regulations/permit clause and analyse its scope; primacy may be weaker.
    required_facts: [lease_has_regulations_clause]
    evidence_helpful: [LEASE]
    legal_basis: [CL-primacy-of-contract]
    drafting_notes: Mandatory when the clause exists - omission is a validator failure.
    prohibited_claims: [unfettered]
    building_blocks: []
    strength: 60

  - module_id: KB-CON-01
    route: CONSIDERATION
    topic: Consideration period
    use_when: {all: [{is: short_presence_before_acceptance}, {not: {is: payment_made}}]}
    do_not_use_when: {is: permitted_period_ended}
    core_proposition: Entry onto land is not automatically acceptance of parking terms.
    required_facts: [total_recorded_duration_min]
    evidence_helpful: []
    legal_basis: [SCOP-consideration]
    drafting_notes: Never merge with end grace.
    prohibited_claims: [free allowance]
    building_blocks: [PP-CON-001, PP-CON-005]
    strength: 65
  - module_id: KB-GRACE-01
    route: GRACE
    topic: End grace period
    use_when: {all: [{is: permitted_period_ended}, {exists: exit_delay_min}]}
    do_not_use_when: {always: false}
    core_proposition: Apply the applicable end-of-parking grace requirement only after establishing it applies.
    required_facts: [exit_delay_min]
    evidence_helpful: []
    legal_basis: [SCOP-grace]
    drafting_notes: No universal 10-minute rule; use resolved Code version values.
    prohibited_claims: [10 minutes always]
    building_blocks: [PP-GRACE-001, PP-GRACE-003]
    strength: 60

  - module_id: KB-ANPR-01
    route: ANPR
    topic: Multiple visits
    use_when: {is: multiple_visits}
    do_not_use_when: {always: false}
    core_proposition: Require review of the complete ANPR sequence rather than two selected images.
    required_facts: [multiple_visits]
    evidence_helpful: [DASHCAM, RECEIPT, LOCATION_RECORD]
    legal_basis: [SCOP-evidence]
    drafting_notes: Keeper-safe - 'the vehicle attended on more than one occasion'.
    prohibited_claims: [calibration]
    building_blocks: [PP-ANPR-003, PP-ANPR-005]
    strength: 80
  - module_id: KB-TIME-01
    route: ANPR
    topic: ANPR presence is not parking time
    use_when: {exists: entry_time}
    do_not_use_when: {always: false}
    core_proposition: Distinguish total presence on controlled land from the period actually parked.
    required_facts: [entry_time, exit_time]
    evidence_helpful: []
    legal_basis: [SCOP-evidence]
    drafting_notes: Supporting point only.
    prohibited_claims: []
    building_blocks: [PP-ANPR-001]
    strength: 30

  - module_id: KB-AUTH-02
    route: AUTHORISATION
    topic: Permit held
    use_when: {is: permit_held}
    do_not_use_when: {is: lease_parking_clause_found}
    core_proposition: Distinguish entitlement from display/registration administration.
    required_facts: [permit_held]
    evidence_helpful: [PERMIT]
    legal_basis: [SCOP-permits]
    drafting_notes: Residential rights supersede generic permit logic.
    prohibited_claims: [automatically cancels]
    building_blocks: [PP-AUTH-002, PP-AUTH-004]
    strength: 70

  - module_id: KB-SIGN-01
    route: SIGNAGE
    topic: Signage adequacy
    use_when: {all: [{is: signage_issue_raised}, {has_evidence: PHOTO}]}
    do_not_use_when: {always: false}
    core_proposition: Assess whether the relevant terms were reasonably brought to attention.
    required_facts: [signage_issue_raised]
    evidence_helpful: [PHOTO]
    legal_basis: [SCOP-signage]
    drafting_notes: Only with a factual trigger; never from 'I didn't see it' alone.
    prohibited_claims: []
    building_blocks: [PP-SIGN-001]
    strength: 45

  - module_id: KB-EQ-01
    route: EQUALITY
    topic: Reasonable adjustments
    use_when: {is: disability_extra_time}
    do_not_use_when: {always: false}
    core_proposition: Consider whether reasonable adjustments / additional time were required.
    required_facts: [disability_extra_time]
    evidence_helpful: []
    legal_basis: [EqA-2010]
    drafting_notes: No unnecessary medical detail. Blue Badge is not the legal test.
    prohibited_claims: []
    building_blocks: [AI-EQ-001]
    strength: 65

  - module_id: KB-LAND-01
    route: LANDOWNER
    topic: Authority to operate
    use_when: {always: true}
    do_not_use_when: {always: false}
    core_proposition: Require evidence of sufficient landowner authority for the site and date.
    required_facts: []
    evidence_helpful: []
    legal_basis: [SCOP-authority]
    drafting_notes: One concise sentence at initial appeal. Never assert no authority exists.
    prohibited_claims: [no authority exists]
    building_blocks: [PP-LAND-001]
    strength: 20

conflicts_with:
  - [KB-PAY-01, KB-CON-01]
  - [KB-RES-01, KB-AUTH-02]

legal_sources:
  PoFA-2012-Sch4:       {title: Protection of Freedoms Act 2012 Schedule 4, jurisdiction: ENGLAND_WALES}
  PoFA-2012-Sch4-para8: {title: PoFA 2012 Sch 4 para 8, jurisdiction: ENGLAND_WALES}
  PoFA-2012-Sch4-para9: {title: PoFA 2012 Sch 4 para 9, jurisdiction: ENGLAND_WALES}
  EqA-2010:             {title: Equality Act 2010, jurisdiction: GB}
  SCOP-payment:         {title: Single Code - payment, versioned: true}
  SCOP-keying:          {title: Single Code - keying errors, versioned: true}
  SCOP-breakdown:       {title: Single Code / Appeals Charter - breakdown, versioned: true}
  SCOP-consideration:   {title: Single Code - consideration period, versioned: true}
  SCOP-grace:           {title: Single Code - grace period, versioned: true}
  SCOP-evidence:        {title: Single Code - evidence / ANPR, versioned: true}
  SCOP-permits:         {title: Single Code - permits, versioned: true}
  SCOP-signage:         {title: Single Code - signage, versioned: true}
  SCOP-authority:       {title: Single Code - landowner authority, versioned: true}
  CL-frustration-impossibility: {title: Common-law frustration / impossibility, case_law_enabled: false}
