# Site jurisdiction from the parking location wording, used only when the notice
# prints no readable site postcode (the keeper's address never decides this).
#
# A postcode printed inside the location text ("Quayside Shopping Centre
# (M50 3AH)") is read first. Otherwise a place name below decides. If the
# wording names places in more than one jurisdiction ("London Road, Glasgow")
# the answer stays UNKNOWN and the postcode is asked as before.
#
# Names that exist in more than one jurisdiction (e.g. Bangor: Wales and
# Northern Ireland) are deliberately left out.
