  - module_id: KB-BREAK-01
    route: BREAKDOWN
    topic: "Mechanical breakdown"
    use_when: {all: [{is: vehicle_immobilised}, {is: immobilisation_prevented_departure}]}
    do_not_use_when: {is: fault_pre_existing_not_preventing}
    core_proposition: "Consider whether an unforeseen supervening event outside the relevant party's control made contractual performance/departure impossible or materially prevented it. Frame as a substantive contractual issue where facts support it, not merely a plea for discretion."
    required_facts: [vehicle_immobilised, immobilisation_cause, immobilisation_prevented_departure]
    evidence_helpful: [RECOVERY_REPORT, GARAGE_INVOICE, CALL_LOG, PHOTO]
    legal_basis: [CL-frustration-impossibility, SCOP-breakdown]
    legal_basis_origin: SOURCE_MODULE
    drafting_notes: Do not state 'breakdown = automatic frustration'. Do not invent the fault or recovery attendance. The conclusion must follow the facts. Order per Appendix B - current-Code breakdown route (AI-BREAK-001) first, frustration/impossibility (AI-BREAK-002) second if the facts support it.
    prohibited_claims: [automatically frustrated, automatically void, invented fault, invented recovery attendance]
    building_blocks: [AI-BREAK-001, AI-BREAK-002]
    strength: 85
    status: ACTIVE
    version: "1.1"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 9. Breakdown / Frustration / Involuntary Immobilisation / KB-BREAK-01"
    change_notes: Core proposition restored to full source wording (previous version dropped "not merely a plea for discretion"). Missing source DO NOT ("Do not invent the fault or recovery attendance") added. Of the two legal bases, only CL-frustration-impossibility is in the module's own field; SCOP-breakdown comes from block AI-BREAK-001 and Appendix B (see legal_sources). Admin fields added.

  - module_id: KB-BREAK-02
    route: BREAKDOWN
    topic: "Puncture / battery / immobilisation"
    use_when: {all: [{is: vehicle_immobilised}, {is: immobilisation_prevented_departure}, {exists: immobilisation_cause}]}
    do_not_use_when: {always: false}
    core_proposition: "Treat as breakdown only where evidence/facts show the vehicle could not reasonably depart or comply; otherwise assess as ordinary delay."
    required_facts: [vehicle_immobilised, immobilisation_cause, immobilisation_prevented_departure]
    evidence_helpful: [RECOVERY_REPORT, GARAGE_INVOICE, PHOTO, CALL_LOG]
    legal_basis: [CL-frustration-impossibility, SCOP-breakdown]
    legal_basis_origin: SOURCE_APPENDIX
    drafting_notes: Severity and safety must come from the answers; never upgrade an inconvenience into an immobilisation.
    prohibited_claims: [automatically frustrated, automatically void]
    building_blocks: [AI-BREAK-001, AI-BREAK-002]
    strength: 80
