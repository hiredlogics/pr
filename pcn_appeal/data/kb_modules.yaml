  - module_id: KB-RES-01
    route: RESIDENTIAL
    topic: "Primacy of pre-existing parking rights"
    use_when: {all: [{in: [resident_status, [RESIDENT, TENANT, LEASEHOLDER]]}, {is: lease_parking_clause_found}]}
    do_not_use_when: {always: false}
    core_proposition: "The actual lease/tenancy/parking grant is the starting point. Later operator signage should not automatically be assumed to vary or extinguish pre-existing contractual/property rights."
    required_facts: [resident_status, lease_parking_clause_found]
    evidence_helpful: [LEASE, TENANCY, SITE_PLAN, CORRESPONDENCE]
    legal_basis: [Lease, CL-primacy-of-contract]
    legal_basis_origin: SOURCE_REGISTER
    drafting_notes: Quote only verbatim uploaded clause text. Do not assert primacy merely because the appellant is a resident - the lease_parking_clause_found gate enforces this.
    prohibited_claims: [unfettered]
    building_blocks: [AI-RES-001]
    strength: 90
    status: ACTIVE
    version: "1.0"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 10. Residential Parking / Primacy of Contract / KB-RES-01"
    change_notes: Core proposition restored to full source wording (previous version dropped "parking grant", "automatically" and "contractual/property"). SITE_PLAN (title/plan) and CORRESPONDENCE (managing-agent correspondence) added to match the source EVIDENCE field. Lease added to legal_basis because the Source Register names the uploaded lease as the primary source for residential rights. Admin fields added.

  - module_id: KB-RES-02
    route: RESIDENTIAL
    topic: "Unfettered right to park"
    # "Grant without the restriction now alleged" is expressed as: a parking
    # clause was found AND the clause finder found no regulations/permit power
