# Structured KB modules converted from "Private Parking AI Legal Knowledge Base V2"
# (Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx).
# use_when / do_not_use_when are machine predicates (see rules/dsl.py).
#
# CONTENTS
#   51 modules converted from the 51 KB-* records in the source document (status ACTIVE).
#   3 modules NOT in the source document - KB-POFA-06, KB-BAY-01, KB-REC-01 -
#   held at status REVIEW. Under KB-GOV-03 they must not be used to draft until
#   they are added to the approved knowledge base and legally reviewed.
#
# SOURCE FIDELITY
#   `topic` and `core_proposition` are copied verbatim from the source document
#   for every source module. Where the previous conversion shortened or reworded
#   them, the change is recorded in that module's `change_notes`.
#   `legal_basis_origin` records where each legal basis comes from:
#     SOURCE_MODULE    - the module's own LEGAL / CODE BASIS field
#     SOURCE_REGISTER  - Section 2 Source Register (Single Code scope) only
#     SOURCE_APPENDIX  - an Appendix A block or Appendix B rule, not the module
#     NOT_IN_SOURCE    - added in conversion; needs legal review (KB-GOV-06)
#
# ADMINISTRATION (Section 19)
#   Every module carries version, effective_from, effective_to, status,
#   source_reference, last_legal_review and change_notes. Dates are null where
#   the source does not state them - an administrator must set them; they are
#   not invented here.
#
# Strength calibration (KB section 16 / Appendix B):
#   90-100  confirmed dispositive statutory or contractual point (may lead)
#   70-89   strong fact-specific ground (may lead)
#   50-69   real but qualified ground (may lead, but rarely first)
#   <50     evidence / signage / authority support only - engines/reasoning.py
#           SUPPORTING_THRESHOLD means these can never lead the letter
#
# P10.3 module_role (optional per-module override; defaults in module_roles.py):
#   SUBSTANTIVE_GROUND      may be a Claim Plan ground and may lead
#   EVIDENCE_REQUIREMENT    may be a Claim Plan ground and may lead
#   SUPPORTING_PROPOSITION  cannot independently create a ground
#   LEGAL_CONCLUSION        cannot independently create a ground
#   STRUCTURAL              never a ground
# Roles do not change topic / core_proposition / building-block wording.
#
# NOTE on `ne`: rules/dsl.py returns True for `ne` when the fact is MISSING, so
# every `ne` gate below is paired with an `exists` gate (KB-PAY-02's
# do_not_use_when relies on the missing-is-True behaviour deliberately).
#
# NOTE on evidence codes: WITNESS and CCTV are new codes added so that
# evidence_helpful matches the source EVIDENCE fields. Add them to the
# evidence-code enum if your loader validates codes.
modules:
  - module_id: KB-POFA-01
    route: POFA
    topic: "Keeper liability threshold"
    use_when: {all: [{eq: [driver_status, UNIDENTIFIED]}, {eq: [jurisdiction, ENGLAND_WALES]}]}
    do_not_use_when: {eq: [relevant_land, false]}
    core_proposition: "Keeper liability is not automatic. If the operator seeks recovery from the keeper under Schedule 4, the applicable statutory conditions must be satisfied."
    required_facts: [notice_route, parking_event_date, notice_issue_date]
    evidence_helpful: [PCN, NTK]
    legal_basis: [PoFA-2012-Sch4]
    legal_basis_origin: SOURCE_MODULE
    drafting_notes: State that liability cannot be transferred to the keeper under Schedule 4. Do not say the underlying charge is automatically invalid merely because keeper liability fails.
    prohibited_claims: [charge automatically invalid]
    building_blocks: [PP-INTRO-002, PP-POFA-001]
    strength: 40
    status: ACTIVE
    version: "1.0"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 3. Keeper Liability / PoFA / KB-POFA-01"
    change_notes: Core proposition restored to source wording. Admin fields added. The jurisdiction gate is not in the source USE WHEN; kept because Schedule 4 applies in England and Wales only.

  - module_id: KB-POFA-02
    route: POFA
    topic: "Postal NTK timing"
    use_when: {all: [{eq: [pofa_route, POSTAL]}, {in: [pofa_finding, [POFA_POSTAL_LATE]]}]}
    do_not_use_when: {eq: [driver_status, FORMALLY_IDENTIFIED]}
    core_proposition: "Assess the statutory delivery timing applicable to a postal Notice to Keeper before alleging lateness."
    required_facts: [parking_event_date, notice_issue_date]
    evidence_helpful: [NTK]
    legal_basis: [PoFA-2012-Sch4-para9]
    legal_basis_origin: SOURCE_MODULE
    drafting_notes: Do not allege a timing failure until the correct statutory calculation is confirmed. Only after the deterministic timing calculation confirms the failure may the letter state that the NTK was not given within the statutory period for the postal route, so keeper liability is not established under Schedule 4.
    prohibited_claims: []
    building_blocks: [PP-POFA-003, PP-POFA-006, PP-POFA-007]
    strength: 95
    status: ACTIVE
    version: "1.1"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 3. Keeper Liability / PoFA / KB-POFA-02"
    change_notes: Core proposition restored to the source instruction ("Assess ... before alleging lateness"). The previous conclusion sentence moved to drafting_notes, where the use_when gate already ensures it is only stated after a confirmed finding. Admin fields added.

  - module_id: KB-POFA-03
    route: POFA
    topic: "Windscreen notice followed by NTK"
    use_when: {all: [{eq: [pofa_route, WINDSCREEN]}, {in: [pofa_finding, [POFA_NTD_NTK_LATE, POFA_NTD_NTK_TOO_EARLY]]}]}
    do_not_use_when: {eq: [driver_status, FORMALLY_IDENTIFIED]}
    core_proposition: "Assess the separate Schedule 4 route and timing/content requirements for a notice following a Notice to Driver."
    required_facts: [ntd_date, notice_issue_date]
    evidence_helpful: [NTK]
    legal_basis: [PoFA-2012-Sch4-para8]
    legal_basis_origin: SOURCE_MODULE
    drafting_notes: Verified finding only. State the specific route requirement that was not met. Content defects on this route are pleaded through KB-POFA-04, never inferred here.
    prohibited_claims: []
    building_blocks: [PP-POFA-004, PP-POFA-006, PP-POFA-007]
    strength: 95
    status: ACTIVE
    version: "1.1"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 3. Keeper Liability / PoFA / KB-POFA-03"
    change_notes: Core proposition restored to source wording, which covers timing AND content requirements (the previous version covered timing only). Drafting note points content defects to KB-POFA-04. Admin fields added.

  - module_id: KB-POFA-04
    route: POFA
    topic: "Mandatory notice content"
    # One boolean per statutory element so that exactly the confirmed defect is
    # pleaded (source: "do not generate a generic checklist challenge"), plus a
    # document-confirmation flag for the DO NOT on OCR uncertainty.
    use_when: {all: [{eq: [driver_status, UNIDENTIFIED]}, {is: ntk_defect_document_confirmed}, {any: [{is: ntk_defect_parking_details}, {is: ntk_defect_keeper_warning}, {is: ntk_defect_creditor}, {is: ntk_defect_charge_amount}, {is: ntk_defect_statutory_invitation}]}]}
    do_not_use_when:
      any:
        - {eq: [pofa_route, NOT_APPLICABLE]}
        - {eq: [relevant_land, false]}
        # Single-face upload may still plead invitation wording that is clearly
        # readable on that face (pass-to-driver explicitly false).
        - {all: [{eq: [notice_sides_complete, false]}, {ne: [ntk_invites_pass_to_driver, false]}]}
    core_proposition: "Use only the precise defect established from the notice; do not generate a generic checklist challenge."
    required_facts: [notice_route, ntk_defect_document_confirmed]
    evidence_helpful: [NTK, PCN]
    legal_basis: [PoFA-2012-Sch4]
    legal_basis_origin: SOURCE_MODULE
    drafting_notes: State only the element actually confirmed against the document. Do not assert defects from OCR uncertainty; require document confirmation where text is unclear.
    prohibited_claims: [generic checklist of defects, defect inferred from unclear text]
    building_blocks: [PP-POFA-005A, PP-POFA-005B, PP-POFA-005C, PP-POFA-005D, PP-POFA-005E, PP-POFA-006, PP-POFA-007]
    strength: 90
    status: ACTIVE
    version: "1.0"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 3. Keeper Liability / PoFA / KB-POFA-04"
    change_notes: Core proposition restored to source wording (previous version added "Schedule 4" and "itself"). Source DO NOT quoted verbatim in drafting_notes. Admin fields added.

  - module_id: KB-POFA-05
    route: POFA
    topic: "Driver not established"
    # FIXED: previously {exists: pofa_finding}, which would also fire if the
    # PoFA checker ever returns a PASS/compliant value. Now fires only on a
    # confirmed failure: a timing finding, a document-confirmed content defect,
    # or (while KB-POFA-06 is in REVIEW) the hire-documentation failure.
    # If your checker emits other FAILURE codes (e.g. no NTK served), add them
    # to the `in` list below.
    use_when:
      all:
        - {eq: [driver_status, UNIDENTIFIED]}
        - any:
            - {in: [pofa_finding, [POFA_POSTAL_LATE, POFA_NTD_NTK_LATE, POFA_NTD_NTK_TOO_EARLY, POFA_NTK_INVITATION_DEFECT]]}
            - all:
                - {is: ntk_defect_document_confirmed}
                - any: [{is: ntk_defect_parking_details}, {is: ntk_defect_keeper_warning}, {is: ntk_defect_creditor}, {is: ntk_defect_charge_amount}, {is: ntk_defect_statutory_invitation}]
    do_not_use_when: {eq: [driver_status, FORMALLY_IDENTIFIED]}
    core_proposition: "If Schedule 4 conditions are not met and the driver has not been established, the operator cannot transfer the driver's liability to the registered keeper under Schedule 4."
    required_facts: [pofa_finding]
    evidence_helpful: [NTK, PCN]
    legal_basis: [PoFA-2012-Sch4]
    legal_basis_origin: NOT_IN_SOURCE
    drafting_notes: Never invite or infer driver identity. This is the conclusion that follows a verified finding, not a free-standing ground.
    prohibited_claims: [the driver was, identity of the driver]
    building_blocks: [PP-POFA-002, PP-POFA-006, PP-POFA-007]
    strength: 93
    status: ACTIVE
    version: "1.1"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 3. Keeper Liability / PoFA / KB-POFA-05"
    change_notes: use_when gate fixed so it fires only on a confirmed PoFA failure, never on any value of pofa_finding. Core proposition restored to source wording ("If Schedule 4 conditions ..."). The source module has no LEGAL / CODE BASIS field; PoFA Sch 4 is named in its core proposition, so the basis is kept but marked NOT_IN_SOURCE. Admin fields added.

  # ---- NOT IN SOURCE DOCUMENT - held at REVIEW (KB-GOV-03) ----
  - module_id: KB-POFA-06
    route: POFA
    topic: Hire vehicle keeper documentation
    use_when: {all: [{is: keeper_is_hire_firm}, {eq: [hire_docs_supplied, false]}]}
    do_not_use_when: {any: [{eq: [pofa_route, NOT_APPLICABLE]}, {eq: [driver_status, FORMALLY_IDENTIFIED]}]}
    core_proposition: Where the registered keeper is a vehicle-hire firm, Schedule 4 imposes additional documentary conditions before keeper liability can transfer; those documents have not been shown to have been supplied.
    required_facts: [keeper_is_hire_firm, hire_docs_supplied]
    evidence_helpful: [HIRE_AGREEMENT, NTK, PCN]
    legal_basis: [PoFA-2012-Sch4]
    legal_basis_origin: NOT_IN_SOURCE
    drafting_notes: State only that the hire-specific documents have not been evidenced. Do not invent which paragraph failed. Never identify a driver.
    prohibited_claims: [the driver was, identity of the driver]
    # PP-POFA-008 does not exist in Appendix A. Draft and approve it before activation.
    building_blocks: [PP-POFA-008, PP-POFA-006, PP-POFA-007]
    strength: 88
    status: REVIEW
    module_role: SUBSTANTIVE_GROUND
    can_lead_letter: false   # P10.5: REVIEW — must not lead until legally activated
    version: "1.0"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: null  # not in source document
    change_notes: Not in the source document. Set to REVIEW under KB-GOV-03. Its building block PP-POFA-008 is not in Appendix A. Activate only after it is added to the approved knowledge base and legally reviewed.

  - module_id: KB-PAY-01
    route: PAYMENT
    topic: "Payment made"
    use_when: {is: payment_made}
    do_not_use_when: {is: terms_rejected_left}
    core_proposition: "Lead with payment and require the operator to reconcile its transaction records with the parking event."
    required_facts: [payment_made, payment_method]
    evidence_helpful: [RECEIPT, APP_SCREENSHOT, BANK_STATEMENT]
    legal_basis: [SCOP-payment]
    legal_basis_origin: SOURCE_REGISTER
    drafting_notes: Merge repeated payment statements into one.
    prohibited_claims: []
    building_blocks: [PP-PAY-001, PP-PAY-002, PP-PAY-006]
    strength: 85
    status: ACTIVE
    version: "1.0"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 5. Payment, Keying and Systems / KB-PAY-01"
    change_notes: Admin fields added. The source module has no LEGAL / CODE BASIS; SCOP-payment rests on the Section 2 Source Register (keying/payment).

  - module_id: KB-PAY-02
    route: PAYMENT
    topic: "Machine failure"
    use_when: {all: [{is: payment_attempt_failed}, {eq: [payment_method, MACHINE]}]}
    # Negation of the discriminator, so the module (and its questions) are
    # pruned until payment_method is known to be MACHINE. `ne` is True when the
    # fact is missing, which is the behaviour wanted here.
    do_not_use_when: {ne: [payment_method, MACHINE]}
    core_proposition: "Analyse the operator-provided payment mechanism and the genuine attempt to comply; request relevant fault/maintenance/transaction records where appropriate."
    required_facts: [payment_attempt_failed, payment_method, payment_failure_detail]
    evidence_helpful: [PHOTO, WITNESS, RECEIPT, APP_SCREENSHOT]
    legal_basis: [SCOP-payment]
    legal_basis_origin: SOURCE_REGISTER
    drafting_notes: Request records; do not assert a fault the evidence does not show.
    prohibited_claims: [the machine was broken all day]
    building_blocks: [PP-PAY-003, PP-PAY-005, PP-PAY-006]
    strength: 75
    status: ACTIVE
    version: "1.1"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 5. Payment, Keying and Systems / KB-PAY-02"
    change_notes: Core proposition restored to source wording. WITNESS added to evidence_helpful (source EVIDENCE lists witness evidence). Admin fields added.

  - module_id: KB-PAY-03
    route: PAYMENT
    topic: "App / digital payment failure"
    use_when: {all: [{is: payment_attempt_failed}, {in: [payment_method, [APP, PHONE, WEBSITE]]}]}
    do_not_use_when: {not: {in: [payment_method, [APP, PHONE, WEBSITE]]}}
    core_proposition: "Consider whether a genuine attempt to comply was prevented by the provided system and whether alternative payment was realistically available."
    required_facts: [payment_attempt_failed, payment_method, payment_failure_detail]
    evidence_helpful: [APP_SCREENSHOT, BANK_STATEMENT, CORRESPONDENCE, PHOTO]
    legal_basis: [SCOP-payment]
    legal_basis_origin: SOURCE_REGISTER
    drafting_notes: Name only the system problem the customer actually reported.
    prohibited_claims: []
    building_blocks: [PP-PAY-004, PP-PAY-005, PP-PAY-006]
    strength: 75
    status: ACTIVE
    version: "1.1"
    effective_from: null      # to be set by administrator
    effective_to: null
    last_legal_review: null   # to be set after legal review
    source_reference: "Private_Parking_AI_Legal_Knowledge_Base_COMPLETE_V2.docx / 5. Payment, Keying and Systems / KB-PAY-03"
    change_notes: Core proposition restored to source wording. CORRESPONDENCE added to evidence_helpful (source EVIDENCE lists support messages). Admin fields added.

  - module_id: KB-KEY-01
    route: KEYING
    topic: "Minor keying error"
    use_when: {all: [{is: payment_made}, {eq: [keying_error_type, MINOR]}]}
    do_not_use_when: {always: false}
    core_proposition: "Treat as a paid parking event with a registration mismatch and apply the applicable Code/keying-error requirements."
    required_facts: [vrm, vrm_entered, keying_error_type]
    evidence_helpful: [RECEIPT, APP_SCREENSHOT]
    legal_basis: [SCOP-keying]
    legal_basis_origin: SOURCE_MODULE
    drafting_notes: Keying and payment are one case theory - do not repeat.
    prohibited_claims: []
    building_blocks: [PP-KEY-002, PP-KEY-004]
    strength: 90
    status: ACTIVE
    version: "1.0"
    effective_from: null      # to be set by administrator
